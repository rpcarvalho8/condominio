<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#D0021B" />
    <title>LUMEN — Sem ligação</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #F5F5F7;
        color: #111;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: 4rem 1.25rem;
      }
      p.brand {
        color: #D0021B;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 0.5rem;
      }
      h1 { font-size: 1.35rem; margin: 0 0 0.75rem; }
      p { color: #555; line-height: 1.5; }
      button {
        margin-top: 1.25rem;
        background: #D0021B;
        color: #fff;
        border: 0;
        border-radius: 0.6rem;
        padding: 0.7rem 1.1rem;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">LUMEN</p>
      <h1>Sem ligação</h1>
      <p>
        A app está instalada, mas o saldo do Ledger e os documentos precisam de rede.
        Não há sincronização offline de dívidas.
      </p>
      <button type="button" onclick="location.href='/f3/portal'">Tentar novamente</button>
    </main>
  </body>
</html>
